name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Errors fail the build; the existing warnings (shadcn/ui exports) do not.
      - name: Lint
        run: npx eslint . --quiet

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
