# Compiles the native iOS app on every push to ios-native, the same simulator
# build Codemagic runs, so a Swift mistake shows up without a Mac.
name: iOS build

on:
  push:
    branches: [ios-native]
    paths: ["ios/**", "scripts/test-native-session-store.py", ".github/workflows/ios-build.yml"]
  pull_request:
    branches: [ios-native]
    paths: ["ios/**", "scripts/test-native-session-store.py", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # publishes the simulator screenshots to the ios-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"

      - name: Check native session storage failure paths
        run: python3 scripts/test-native-session-store.py

      # Signed to run locally (ad hoc, no Apple account), not unsigned: an
      # unsigned build drops the entitlements, so the app and the widget get
      # separate storage instead of the shared App Group and every widget
      # says "Open CanvasPro" however much the app has loaded.
      - name: Compile the SwiftUI app (simulator, signed to run locally)
        run: |
          . ios/backend-public.env
          cd ios/App
          status=0
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            -quiet \
            SUPABASE_URL="$CANVASPRO_DEFAULT_SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$CANVASPRO_DEFAULT_SUPABASE_PUBLISHABLE_KEY" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES > build.log 2>&1 || status=$?
          cat build.log
          # Compiler errors as annotations, readable on the run page without the log.
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line#*/ios/App/}"; done
          exit $status

      - name: Check the app and the widget share the App Group
        run: |
          # Every entitlements file Xcode generated for this build (simulator
          # builds embed the "-Simulated" ones in the binary).
          find ios/App/build -name "*.xcent" | while read -r f; do
            echo "::notice::xcent $(basename "$f"): $(grep -c 'group.app.canvaspro.mobile' "$f") App Group match(es)"
          done
          # Both targets must ask for the App Group. On the simulator these
          # "-Simulated" entitlements are the ones that count.
          for name in App.app CanvasProWidgets.appex; do
            f=$(find ios/App/build -name "$name-Simulated.xcent" | head -1)
            if [ -z "$f" ] || ! grep -q "group.app.canvaspro.mobile" "$f"; then
              echo "::error::$name does not request the App Group: the widget can't read what the app saves"
              exit 1
            fi
          done
          # The real test: installed in a simulator, does the app get the shared
          # App Group folder the widget reads from?
          UDID=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if folder=$(xcrun simctl get_app_container "$UDID" app.canvaspro.mobile group.app.canvaspro.mobile 2>&1); then
            echo "::notice::App Group works on the simulator: $(basename "$folder")"
            status=0
          else
            echo "::error::The installed app has no App Group folder: $folder"
            status=1
          fi
          xcrun simctl shutdown "$UDID" || true
          exit $status

      # A look at the real app: the build runs in an iPhone simulator on sample
      # data (debug-only -CanvasProDemo, no sign-in) and each tab is captured
      # in dark and light. A screenshot problem never fails the build.
      - name: Take simulator screenshots
        id: shots
        continue-on-error: true
        run: |
          APP=ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          BUNDLE=app.canvaspro.mobile
          UDID=$(xcrun simctl list devices available | grep -E "^ +iPhone 1[6-9] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "::notice::Simulator: $(xcrun simctl list devices | grep "$UDID" | sed 's/^ *//')"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # One launch per page: a link would stop at an "Open in CanvasPro?" prompt.
          for mode in dark light; do
            for page in dashboard assignments study grades announcements settings; do
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE" -CanvasProDemo YES -CanvasProColorScheme "$mode" -CanvasProDemoPage "$page"
              sleep 8
              xcrun simctl io "$UDID" screenshot --type=jpeg "shots/$mode-$page.jpg"
            done
          done
          # The first-launch tutorial, one launch per page (debug-only -CanvasProDemoTutorial).
          for page in 0 1 2 3 4; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -CanvasProDemo YES -CanvasProDemoTutorial "$page"
            sleep 8
            xcrun simctl io "$UDID" screenshot --type=jpeg "shots/tutorial-$((page + 1)).jpg"
          done
          # Every widget at its real size on sample data (debug-only -CanvasProDemoWidgets).
          for mode in dark light; do
            for page in home large classes live; do
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE" -CanvasProDemo YES -CanvasProColorScheme "$mode" -CanvasProDemoWidgets "$page"
              sleep 8
              xcrun simctl io "$UDID" screenshot --type=jpeg "shots/widgets-$mode-$page.jpg"
            done
          done
          ls -la shots

      - name: Upload simulator screenshots for review
        if: steps.shots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: shots/

      # One commit, replaced each run, on a branch nothing else uses (Lovable
      # syncs only main), so the images are viewable without signing in.
      - name: Publish screenshots to the ios-screenshots branch
        if: steps.shots.outcome == 'success' && github.ref == 'refs/heads/ios-native'
        run: |
          cd shots
          git init -q -b ios-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Simulator screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ios-screenshots
          echo "::notice::Screenshots: https://github.com/${GITHUB_REPOSITORY}/tree/ios-screenshots"
