# Compiles the native iOS app on every push to ios-native, the same unsigned
# simulator build Codemagic runs, so a Swift mistake shows up without a Mac.
name: iOS build

on:
  push:
    branches: [ios-native]
    paths: ["ios/**", "scripts/test-native-session-store.py", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # publishes the simulator screenshots to the ios-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"

      - name: Check native session storage failure paths
        run: python3 scripts/test-native-session-store.py

      - name: Compile the SwiftUI app (simulator, unsigned)
        run: |
          . ios/backend-public.env
          cd ios/App
          status=0
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            -quiet \
            SUPABASE_URL="$CANVASPRO_DEFAULT_SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$CANVASPRO_DEFAULT_SUPABASE_PUBLISHABLE_KEY" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          cat build.log
          # Compiler errors as annotations, readable on the run page without the log.
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line#*/ios/App/}"; done
          exit $status

      # A look at the real app: the build runs in an iPhone simulator on sample
      # data (debug-only -CanvasProDemo, no sign-in) and each tab is captured
      # in dark and light. A screenshot problem never fails the build.
      - name: Take simulator screenshots
        id: shots
        continue-on-error: true
        run: |
          APP=ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          BUNDLE=app.canvaspro.mobile
          UDID=$(xcrun simctl list devices available | grep -E "^ +iPhone 1[6-9] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "::notice::Simulator: $(xcrun simctl list devices | grep "$UDID" | sed 's/^ *//')"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for mode in dark light; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -CanvasProDemo YES -CanvasProColorScheme "$mode"
            sleep 9
            for page in dashboard assignments study grades announcements settings; do
              xcrun simctl openurl "$UDID" "canvaspro://$page"
              sleep 3
              xcrun simctl io "$UDID" screenshot --type=jpeg "shots/$mode-$page.jpg"
            done
          done
          ls -la shots

      # One commit, replaced each run, on a branch nothing else uses (Lovable
      # syncs only main), so the images are viewable without signing in.
      - name: Publish screenshots to the ios-screenshots branch
        if: steps.shots.outcome == 'success'
        run: |
          cd shots
          git init -q -b ios-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Simulator screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ios-screenshots
          echo "::notice::Screenshots: https://github.com/${GITHUB_REPOSITORY}/tree/ios-screenshots"
