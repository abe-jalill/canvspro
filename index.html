<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CanvasPro</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      .launch-shell {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #f7f7f8;
        color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      }
      .launch-shell__brand {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #18181b;
        color: white;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.04em;
        box-shadow: 0 12px 32px rgb(0 0 0 / 14%);
      }
      .launch-shell__name {
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      .launch-shell__bar {
        width: 76px;
        height: 3px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(24 24 27 / 10%);
      }
      .launch-shell__bar::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
        animation: launch-progress 900ms ease-in-out infinite alternate;
      }
      @keyframes launch-progress {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(138%);
        }
      }
      @media (prefers-color-scheme: dark) {
        .launch-shell {
          background: #09090b;
          color: #fafafa;
        }
        .launch-shell__brand {
          background: #fafafa;
          color: #18181b;
          box-shadow: 0 12px 32px rgb(0 0 0 / 40%);
        }
        .launch-shell__bar {
          background: rgb(250 250 250 / 14%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-shell__bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="launch-shell" role="status" aria-label="Opening CanvasPro">
        <div class="launch-shell__brand" aria-hidden="true">CP</div>
        <span class="launch-shell__name">CanvasPro</span>
        <div class="launch-shell__bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/mobile.tsx"></script>
  </body>
</html>
