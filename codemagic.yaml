workflows:
  ios-workflow:
    name: CanvasPro iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app