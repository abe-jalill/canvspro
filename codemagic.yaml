workflows:
  ios-workflow:
    name: CanvasPro iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest

    scripts:
      - name: Build native SwiftUI app
        script: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            SUPABASE_URL="${SUPABASE_URL:-$VITE_SUPABASE_URL}" \
            SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY:-$VITE_SUPABASE_PUBLISHABLE_KEY}" \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  ios-release-check:
    name: CanvasPro iOS Release compile
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Compile production SwiftUI path
        script: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            SUPABASE_URL="${SUPABASE_URL:-$VITE_SUPABASE_URL}" \
            SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY:-$VITE_SUPABASE_PUBLISHABLE_KEY}" \
            CODE_SIGNING_ALLOWED=NO
